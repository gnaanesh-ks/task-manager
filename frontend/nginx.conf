worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile        on;
  keepalive_timeout  65;
  gzip on;
  gzip_types text/css application/javascript application/json;

  server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    location / {
      try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to backend services when running behind this Nginx
    # directly (docker-compose / non-ingress setups). In EKS, Ingress
    # handles this routing instead and these blocks are inert but harmless.
    location /api/auth/ {
      proxy_pass http://auth-service:4000/api/auth/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/tasks/ {
      proxy_pass http://task-service:4001/api/tasks/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    location /healthz {
      access_log off;
      return 200 "ok\n";
    }
  }
}
