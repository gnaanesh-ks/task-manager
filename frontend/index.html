<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Task Manager</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%236366f1'/%3E%3Cpath d='M9 16.5l4.5 4.5L23 11' stroke='white' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <svg class="brand-logo" width="28" height="28" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
        <rect width="32" height="32" rx="8" fill="#6366f1"/>
        <path d="M9 16.5l4.5 4.5L23 11" stroke="white" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span>Task Manager</span>
    </div>
    <nav id="nav-auth-state"></nav>
  </header>

  <main class="container">
    <section id="auth-view" class="card hidden">
      <div class="tabs">
        <button class="tab-btn active" data-tab="login">Login</button>
        <button class="tab-btn" data-tab="signup">Sign Up</button>
      </div>

      <form id="login-form" class="auth-form">
        <h2>Welcome back</h2>
        <label>Email</label>
        <input type="email" id="login-email" required>
        <label>Password</label>
        <input type="password" id="login-password" required>
        <button type="submit" class="btn-primary">Login</button>
        <p class="error-msg" id="login-error"></p>
      </form>

      <form id="signup-form" class="auth-form hidden">
        <h2>Create an account</h2>
        <label>Username</label>
        <input type="text" id="signup-username" required>
        <label>Email</label>
        <input type="email" id="signup-email" required>
        <label>Password</label>
        <input type="password" id="signup-password" required minlength="6">
        <button type="submit" class="btn-primary">Sign Up</button>
        <p class="error-msg" id="signup-error"></p>
      </form>
    </section>

    <section id="app-view" class="hidden">
      <div class="card task-input-card">
        <h2>New Task</h2>
        <form id="task-form">
          <input type="text" id="task-title" placeholder="Task title" required>
          <textarea id="task-description" placeholder="Description (optional)"></textarea>
          <select id="task-priority">
            <option value="low">Low</option>
            <option value="medium" selected>Medium</option>
            <option value="high">High</option>
          </select>
          <button type="submit" class="btn-primary">Add Task</button>
        </form>
      </div>

      <div class="card">
        <div class="filter-bar">
          <h2>My Tasks</h2>
          <select id="filter-status">
            <option value="all">All</option>
            <option value="pending">Pending</option>
            <option value="completed">Completed</option>
          </select>
        </div>
        <ul id="task-list"></ul>
        <p id="empty-state" class="hidden">No tasks yet. Add one above!</p>
      </div>
    </section>

    <div id="toast" class="toast hidden"></div>
  </main>

  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
