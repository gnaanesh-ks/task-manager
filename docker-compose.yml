version: "3.9"

services:
  mongodb:
    image: mongo:7.0
    container_name: mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: mongo-user
      MONGO_INITDB_ROOT_PASSWORD: mongo-pass
      MONGO_INITDB_DATABASE: taskflow
    volumes:
      - mongo-data:/data/db
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  auth-service:
    build: ./services/auth-service
    container_name: auth-service
    restart: unless-stopped
    environment:
      PORT: 4000
      MONGO_URI: mongodb://mongo-user:mongo-pass@mongodb:27017/taskflow?authSource=admin
      JWT_SECRET: local-dev-secret-change-in-production
      JWT_EXPIRES_IN: 1d
      NODE_ENV: development
    ports:
      - "4000:4000"
    depends_on:
      mongodb:
        condition: service_healthy

  task-service:
    build: ./services/task-service
    container_name: task-service
    restart: unless-stopped
    environment:
      PORT: 4001
      MONGO_URI: mongodb://mongo-user:mongo-pass@mongodb:27017/taskflow?authSource=admin
      JWT_SECRET: local-dev-secret-change-in-production
      NODE_ENV: development
    ports:
      - "4001:4001"
    depends_on:
      mongodb:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: frontend
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - auth-service
      - task-service

volumes:
  mongo-data:
